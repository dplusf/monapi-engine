# Engine stack: api + worker.
# Production layout: engine on :8007 behind the platform reverse proxy (Traefik).
# The product site lives in the separate (private) monapi-site repo.

services:
  api:
    build: ./engine
    container_name: monapi-api
    env_file: .env
    volumes:
      - engine-data:/data
    ports:
      - "${API_PORT:-8007}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./engine
    container_name: monapi-worker
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - engine-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  engine-data:
