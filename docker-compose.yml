# Full stack: engine (api + worker) and site.
# Production layout: site on :3007, engine on :8007, TLS via Traefik (platform).
# Configuration comes from .env (see engine/.env.example and site/.env.example).

services:
  api:
    build: ./engine
    container_name: monapi-api
    env_file: .env
    volumes:
      - engine-data:/data
    ports:
      - "8007:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./engine
    container_name: monapi-worker
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - engine-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  site:
    build: ./site
    container_name: monapi-site
    env_file: .env
    environment:
      MONAPI_ENGINE_BASE_URL: http://api:8000
    ports:
      - "3007:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  engine-data:
