# Standalone compose for the engine only (api + worker).
# The full stack including the site lives in ../docker-compose.yml.
# No Caddy here — TLS is terminated by the platform's reverse proxy (Traefik).

services:
  api:
    build: .
    container_name: monapi-engine-api
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    container_name: monapi-engine-worker
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
