# Policy profiles: named variants of thresholds / weight overrides / ignored
# categories. Selected per request via ?profile=<name>. Unknown profiles are
# rejected with 400. "default" is required and used when no profile is given.
#
# thresholds: score >= block -> "block", score >= challenge -> "challenge"
# weights:    per-category weight overrides applied at scoring time
# ignore:     categories that contribute no score and no signals
profiles:
  default:
    thresholds: { challenge: 30, block: 80 }
  checkout:
    thresholds: { challenge: 20, block: 60 }
    weights: { anonymizer: 40 }
  newsletter:
    thresholds: { challenge: 50, block: 90 }
    ignore: [free_mail]
  # Something of value given away against a form — a sample, a free
  # shipment, a download.
  #
  # free_mail 30: a free mailbox is not abuse, but it is the cheapest way
  # to claim twice, so it earns a challenge on its own rather than being
  # waved through or blocked.
  #
  # disposable 80: nobody has a legitimate reason to receive a sample at a
  # ten-minute address. The asymmetry justifies the hard line — a false
  # block costs an interested person one retry with a real address, a
  # false allow costs the goods.
  lead:
    thresholds: { challenge: 30, block: 80 }
    weights: { free_mail: 30, disposable: 80 }
